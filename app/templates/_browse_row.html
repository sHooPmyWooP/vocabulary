<div class="browse-row" id="entry-{{ entry.id }}" data-testid="browse-row">
  <div class="word-monogram" aria-hidden="true">{{ entry.word[0] | upper }}</div>
  <div class="browse-main">
    <div class="browse-title-line">
      <span class="browse-word">{{ entry.word }}</span>
      <span class="state-chip state-{{ entry.state }}">{{ entry.state }}</span>
    </div>
    <span class="browse-meta">
      Due {{ entry.due_date }}
      {% if entry.lookup_count > 1 %} · {{ entry.lookup_count }} lookups{% endif %}
    </span>
    {% if entry.note %}<p class="browse-note">{{ entry.note }}</p>{% endif %}
  </div>
  <div class="browse-actions">
    <button class="icon-button"
            hx-get="/entry/{{ entry.id }}/edit"
            hx-target="#entry-{{ entry.id }}"
            hx-swap="outerHTML" aria-label="Edit {{ entry.word }}" title="Edit">✎</button>
    <button class="icon-button danger"
            hx-delete="/entry/{{ entry.id }}"
            hx-target="#entry-{{ entry.id }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this word?" aria-label="Delete {{ entry.word }}" title="Delete">×</button>
  </div>
</div>
