<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vocabulary{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Vocabulary home">
        <span class="brand-mark" aria-hidden="true">V</span>
        <span>Vocabulary</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="/lookup" class="{{ 'active' if request.url.path.startswith('/lookup') else '' }}" {% if request.url.path.startswith('/lookup') %}aria-current="page"{% endif %}><span aria-hidden="true">⌕</span> Lookup</a>
        <a href="/review" class="{{ 'active' if request.url.path.startswith('/review') else '' }}" {% if request.url.path.startswith('/review') %}aria-current="page"{% endif %}><span aria-hidden="true">◆</span> Review</a>
        <a href="/browse" class="{{ 'active' if request.url.path.startswith('/browse') else '' }}" {% if request.url.path.startswith('/browse') %}aria-current="page"{% endif %}><span aria-hidden="true">▤</span> Browse</a>
        <a href="/stats" class="{{ 'active' if request.url.path.startswith('/stats') else '' }}" {% if request.url.path.startswith('/stats') %}aria-current="page"{% endif %}><span aria-hidden="true">↗</span> Stats</a>
        <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
          <span aria-hidden="true">◐</span>
        </button>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Build your vocabulary, one curious word at a time.</footer>
  <script>
    function toggleTheme() {
      var root = document.documentElement;
      var current = root.getAttribute("data-theme");
      if (!current) {
        // No explicit choice yet: flip away from whatever the system shows.
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        current = systemDark ? "dark" : "light";
      }
      var next = current === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    }
  </script>
</body>
</html>
